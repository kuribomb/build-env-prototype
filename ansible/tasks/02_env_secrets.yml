---
- name: .env の存在確認
  ansible.builtin.stat:
    path: "{{ project_dir }}/.env"
  register: env_file

- name: .env を .env.example から生成
  ansible.builtin.copy:
    src: "{{ project_dir }}/.env.example"
    dest: "{{ project_dir }}/.env"
    remote_src: true
  when: not env_file.stat.exists

- name: パスワード類をランダム生成して埋め込み
  ansible.builtin.replace:
    path: "{{ project_dir }}/.env"
    regexp: "{{ item.regexp }}"
    replace: "{{ item.replace }}"
  loop:
    - regexp: '^GITLAB_ROOT_PASSWORD=CHANGEME$'
      replace: "GITLAB_ROOT_PASSWORD={{ lookup('password', '/dev/null length=20 chars=ascii_letters,digits') }}"
    - regexp: '^GITLAB_PAT=CHANGEME$'
      replace: "GITLAB_PAT={{ lookup('password', '/dev/null length=30 chars=ascii_letters,digits') }}"
    - regexp: '^JENKINS_ADMIN_PASSWORD=CHANGEME$'
      replace: "JENKINS_ADMIN_PASSWORD={{ lookup('password', '/dev/null length=20 chars=ascii_letters,digits') }}"
  loop_control:
    label: "{{ item.regexp }}"
  when: not env_file.stat.exists

- name: secrets ディレクトリの存在保証
  ansible.builtin.file:
    path: "{{ project_dir }}/secrets"
    state: directory
    mode: "0700"

- name: Jenkins Agent 接続用 SSH 鍵ペアの生成(未生成の場合のみ)
  ansible.builtin.command: >
    ssh-keygen -q -t ed25519 -N '' -C jenkins-agent
    -f {{ project_dir }}/secrets/agent_ssh_key
  args:
    creates: "{{ project_dir }}/secrets/agent_ssh_key"

- name: 公開鍵の読み込み
  ansible.builtin.slurp:
    src: "{{ project_dir }}/secrets/agent_ssh_key.pub"
  register: agent_pub_raw

- name: AGENT_SSH_PUBKEY を .env に反映
  ansible.builtin.lineinfile:
    path: "{{ project_dir }}/.env"
    regexp: '^AGENT_SSH_PUBKEY='
    line: 'AGENT_SSH_PUBKEY="{{ (agent_pub_raw.content | b64decode).strip() }}"'

- name: .env の値を読み込み
  ansible.builtin.shell: |
    set -a
    source ./.env
    printf '{'
    printf '"HOST_ADDR":"%s",' "${HOST_ADDR:-localhost}"
    printf '"PORTAL_PORT":"%s",' "${PORTAL_PORT:-8000}"
    printf '"JENKINS_PORT":"%s",' "${JENKINS_PORT:-8080}"
    printf '"GITLAB_PORT":"%s",' "${GITLAB_PORT:-8929}"
    printf '"NAS_PORT":"%s",' "${NAS_PORT:-8081}"
    printf '"TEAMS_PORT":"%s",' "${TEAMS_PORT:-8082}"
    printf '"JENKINS_ADMIN_USER":"%s",' "${JENKINS_ADMIN_USER:-admin}"
    printf '"JENKINS_ADMIN_PASSWORD":"%s",' "${JENKINS_ADMIN_PASSWORD}"
    printf '"GITLAB_ROOT_PASSWORD":"%s"' "${GITLAB_ROOT_PASSWORD}"
    printf '}'
  args:
    chdir: "{{ project_dir }}"
    executable: /bin/bash
  changed_when: false
  register: env_json

- name: 環境変数をファクトとして保持
  ansible.builtin.set_fact:
    env: "{{ env_json.stdout | from_json }}"
