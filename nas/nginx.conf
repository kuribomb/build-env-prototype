# NAS(成果物保管先)の閲覧用設定
# ホストディレクトリ(NAS_HOST_PATH)のバインドマウントを
# 読み取り専用でディレクトリリスティング公開する
server {
    listen 80;
    server_name _;
    charset utf-8;

    root /nas;

    location / {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # 成果物のテキストをブラウザ内で直接表示できるようにする
    location ~ \.txt$ {
        default_type "text/plain; charset=utf-8";
    }
}
